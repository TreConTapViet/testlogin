<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tủ đồ thông minh: gợi ý trang phục theo hoàn cảnh và thời tiết." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Gắn theme trước khi React chạy để không bị nháy màu khi tải trang
      try {
        var savedTheme = localStorage.getItem('theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch (error) {
        // Trình duyệt chặn localStorage: dùng giao diện sáng
      }
    </script>
    <title>Tủ Đồ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
